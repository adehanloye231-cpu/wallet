<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SabiPay - Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-container">
<div class="auth-brand"><div class="logo-mark">S</div><h1>SabiPay</h1><p>Simple, secure and smart payments.</p></div>
<section class="auth-card"><h2>Welcome Back 👋</h2><p class="muted">Login to continue to your wallet.</p>
<form id="loginForm"><label>Email</label><input id="loginEmail" type="email" placeholder="Enter your email" required>
<label>Password</label><div class="password-wrap"><input id="loginPassword" type="password" placeholder="Enter your password" required><button type="button" class="password-toggle" data-target="loginPassword">Show</button></div>
<a class="forgot-link" href="#">Forgot password?</a><button class="primary-btn" type="submit">LOGIN</button></form>
<p class="switch-auth">Don't have an account? <a href="signup.html">Create Account</a></p></section></main><script src="js/app.js"></script></body></html>
